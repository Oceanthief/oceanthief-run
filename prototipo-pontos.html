<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cada quilômetro, um ponto</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
  <script>
    try {
      var t = localStorage.getItem("strava-site:tema");
      document.documentElement.dataset.tema = t || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@300..800&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/visual.css">
</head>
<body>
  <!-- Protótipo: fica fora do site publicado (o workflow só copia as páginas que ele lista). -->
  <header class="topo"></header>
  <main id="conteudo">
    <div class="recipiente">
      <section class="secao" id="pontos-km">
        <div class="secao-cabeca"><div><h2 data-t>Cada quilômetro, um ponto</h2></div></div>
        <div id="pontos"><p class="vazio" data-t>Carregando os treinos...</p></div>
      </section>
    </div>
  </main>
  <footer class="rodape"></footer>
  <script type="module" src="assets/js/prototipo-pontos.js"></script>
</body>
</html>
