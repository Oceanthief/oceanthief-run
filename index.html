<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Oceanthief Run</title>
  <meta name="description" content="Treinos, recordes e a estrada até a maratona de Porto Alegre, direto do Strava.">
  <meta name="theme-color" content="#190c07">
  <meta property="og:site_name" content="The Oceanthief Run">
  <meta property="og:title" content="The Oceanthief Run">
  <meta property="og:description" content="Treinos, recordes e a estrada até a maratona de Porto Alegre, direto do Strava.">
  <meta property="og:image" content="https://oceanthief.github.io/oceanthief-run/assets/img/compartilhar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Oceanthief Run: Victor correndo uma meia maratona">
  <meta property="og:url" content="https://oceanthief.github.io/oceanthief-run/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icone-180.png">
  <link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/img/corrida-dia.jpg" imagesrcset="assets/img/corrida-dia.jpg 1000w, assets/img/corrida-dia-grande.jpg 1920w" imagesizes="(min-width: 900px) 60vw, 100vw" fetchpriority="high">
  <script>
    try {
      var t = localStorage.getItem("strava-site:tema");
      document.documentElement.dataset.tema = t || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@300..800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/visual.css">
</head>
<body class="com-capa">
  <header class="topo"></header>

  <main id="conteudo">
    <div class="recipiente">
      <section class="abertura" id="inicio" aria-label="Abertura" data-t-aria>
        <p class="vazio" data-t>Carregando os treinos...</p>
      </section>

      <section class="secao sobre" id="sobre">
        <div class="secao-cabeca"></div>
        <div class="texto-sobre" id="texto-sobre"></div>
      </section>

      <section class="secao" id="alvos">
        <div class="secao-cabeca"></div>
        <div id="lista-alvos"></div>
      </section>

      <section class="secao" id="recordes">
        <div class="secao-cabeca"></div>
        <div class="grade-recordes">
          <div>
            <h3 class="bloco-titulo" data-t>Melhores tempos</h3>
            <div id="tabela-recordes"></div>
          </div>
          <div>
            <h3 class="bloco-titulo" data-t>Provas</h3>
            <div id="provas"></div>
          </div>
        </div>
        <div class="conquistas" id="conquistas"></div>
      </section>

      <section class="secao" id="recentes">
        <div class="secao-cabeca com-acoes"><div class="abas" id="abas-recentes"></div></div>
        <div class="grade-recentes">
          <div id="lista-recentes"></div>
          <div class="resumo-periodo" id="resumo-recentes"></div>
        </div>
      </section>

      <section class="secao" id="destaques">
        <div class="secao-cabeca com-acoes"><div class="abas" id="abas-destaques"></div></div>
        <div id="tabela-destaques"></div>
      </section>

      <section class="secao" id="numeros">
        <div class="secao-cabeca com-acoes"><div class="abas" id="abas-numeros"></div></div>
        <div class="grade-graficos" id="graficos"></div>
      </section>

      <section class="secao" id="constancia">
        <div class="secao-cabeca com-acoes"><div class="abas" id="abas-constancia"></div></div>
        <div class="ano-curso" id="ano-curso" hidden></div>
        <div class="calendario" id="calendario"></div>
        <div class="escala" aria-hidden="true"><span data-t>menos</span> <i class="n0"></i><i class="n1"></i><i class="n2"></i><i class="n3"></i><i class="n4"></i> <span data-t>mais</span></div>
        <dl class="fatos" id="fatos-constancia"></dl>
        <div class="cartao-grafico" style="padding:0;background:none">
          <h3 id="titulo-mensal">Por mês</h3>
          <p class="nota" data-t>Distância de cada mês do período escolhido.</p>
          <div class="grafico" id="g-mensal"></div>
        </div>
      </section>

      <section class="secao" id="clima">
        <div class="secao-cabeca"></div>
        <div id="conteudo-clima"></div>
      </section>

      <section class="secao" id="lugares">
        <div class="secao-cabeca"></div>
        <div class="geo">
          <div class="mapa" id="mapa" role="region" aria-label="Mapa com as rotas dos treinos" data-t-aria></div>
          <div class="geo-faixa" id="geo-faixa"></div>
        </div>
        <div class="geo-viagens" id="painel-lugares"></div>
      </section>

      <section class="secao" id="equipamento">
        <div class="secao-cabeca"></div>
        <div class="equipamento" id="lista-equipamento"></div>
      </section>
    </div>
  </main>

  <footer class="rodape"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script type="module" src="assets/js/inicio.js"></script>
</body>
</html>
