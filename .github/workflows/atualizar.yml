name: Atualizar com o Strava

on:
  # o aviso do Strava (via Cloudflare Worker) a cada atividade criada, editada ou apagada
  repository_dispatch:
    types: [strava]
  schedule:
    # rede de segurança, caso algum aviso se perca: 06h, 13h e 21h no horário de Brasília
    - cron: "0 0,9,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url || steps.publicar2.outputs.page_url }}
    steps:
      # Sempre a ponta da main, não o commit que disparou a rodada: uma rodada que ficou na fila
      # atrás de outra começa já com o que a anterior guardou.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar treinos novos do Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/sync_strava.py --max-detalhes 90 --max-series 90

      - name: Guardar os dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada novo no Strava."
            exit 0
          fi
          git commit -m "Atualiza dados do Strava"
          # Se chegou algo na main durante a rodada (código novo, ou outra rodada do robô), o push
          # é recusado. Então traz o que chegou, põe os dados por cima e tenta de novo. Num conflito
          # dentro de data/, valem os dados que esta rodada acabou de gerar (no rebase, "theirs" é
          # o commit do robô).
          for tentativa in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "A main mudou durante a rodada. Juntando e tentando de novo ($tentativa de 5)..."
            sleep $((tentativa * 3))
            git pull --rebase -X theirs origin main
          done
          echo "Não consegui guardar os dados depois de 5 tentativas."
          exit 1

      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp -r index.html atividade.html plano.html provas.html evolucao.html pontos.html assets config _site/
          mkdir _site/data
          cp -r data/site.json data/rotas.json data/evolucao.json data/pontos.json data/atividades _site/data/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      # O GitHub Pages deixa o navegador guardar os arquivos por 10 minutos.
      # Com uma etiqueta que muda quando o código muda, a versão nova aparece na hora.
      - name: Etiquetar a versão do CSS e dos scripts
        working-directory: _site
        run: |
          V=$(cat assets/css/*.css assets/js/*.js *.html | sha1sum | cut -c1-10)
          sed -i -E "s#(assets/(css|js)/[a-z]+\.(css|js))\"#\1?v=$V\"#g" *.html
          sed -i -E "s#from \"\./([a-z]+)\.js\"#from \"./\1.js?v=$V\"#g" assets/js/*.js
          # e os módulos carregados só quando precisa: import("./compartilhar.js")
          sed -i -E "s#import\(\"\./([a-z]+)\.js\"\)#import(\"./\1.js?v=$V\")#g" assets/js/*.js
          echo "Versão do código: $V"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicar
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Às vezes o GitHub ainda não enxerga o pacote recém-enviado e a publicação falha
      # ("No artifacts named github-pages"). Espera um pouco e tenta de novo.
      - name: Esperar antes da segunda tentativa
        if: steps.publicar.outcome == 'failure'
        run: sleep 20

      - id: publicar2
        if: steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4
