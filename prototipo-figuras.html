<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figuras para compartilhar</title>
  <meta name="robots" content="noindex">
  <!-- Protótipo: fica fora do site publicado (o workflow só copia as páginas que ele lista). -->
  <link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
  <script>
    try {
      var t = localStorage.getItem("strava-site:tema");
      document.documentElement.dataset.tema = t || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Forum&family=Manrope:wght@300..800&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/visual.css">
  <style>
    .fig-controles {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.5rem;
      margin: 1.5rem 0 2rem;
      color: var(--texto-2);
      font-size: 0.9375rem;
    }
    .fig-controles select {
      max-width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--linha-forte);
      border-radius: var(--raio-p, 8px);
      background: var(--painel);
      color: var(--texto);
      font: inherit;
    }
    .fig-cores { display: flex; gap: 0.4rem; align-items: center; }
    .fig-cores button {
      width: 1.9rem;
      height: 1.9rem;
      border: 2px solid var(--linha-forte);
      border-radius: 50%;
      cursor: pointer;
    }
    .fig-cores button[aria-pressed="true"] { border-color: var(--texto); box-shadow: 0 0 0 2px var(--fundo) inset; }
    .fig-controles label { display: inline-flex; gap: 0.45rem; align-items: center; cursor: pointer; }
    .fig-treino { flex: 1 1 22rem; min-width: 0; }
    .fig-treino select { flex: 1; min-width: 0; width: 100%; }
    .fig-foto input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    /* "Sua foto" parece mais um botão do grupo */
    .fig-foto span {
      display: inline-block;
      padding: 0.45rem 1rem;
      border: 1px solid var(--linha-forte);
      border-radius: 999px;
      color: var(--texto-2);
      font-weight: 600;
    }
    .fig-foto input:focus-visible + span { outline: 2px solid var(--destaque); outline-offset: 2px; }
    #fig-fundo { flex-wrap: wrap; }
    .fig-galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
      gap: 1.75rem;
    }
    .fig-cartao { display: grid; gap: 0.75rem; align-content: start; }
    .fig-previa {
      display: grid;
      place-items: center;
      border-radius: 10px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }
    .fig-previa img { display: block; width: 100%; height: auto; }
    /* fundos da prévia: o PNG continua transparente */
    .fundo-xadrez .fig-previa { background-color: #2a2a2a; background-image: conic-gradient(#3a3a3a 25%, #2a2a2a 0 50%, #3a3a3a 0 75%, #2a2a2a 0); background-size: 28px 28px; }
    .fundo-escuro .fig-previa { background: #121212; }
    .fundo-claro .fig-previa { background: #cfcac2; }
    .fundo-foto .fig-previa { background-color: #121212; }
    .fig-rodape { display: grid; gap: 0.5rem; }
    .fig-rodape h3 { font-size: 1rem; }
    .fig-acoes { display: flex; gap: 0.4rem; }
    .fig-acoes button {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--linha-forte);
      border-radius: 999px;
      background: none;
      color: var(--texto);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .fig-acoes button:hover { border-color: var(--texto-2); }
    .fig-acoes button.feito { border-color: var(--destaque); color: var(--destaque-tx); }
    .fig-nota { color: var(--texto-3); font-size: 0.875rem; margin: -1rem 0 2rem; max-width: 60ch; }
  </style>
</head>
<body>
  <header class="topo"></header>
  <main id="conteudo">
    <div class="recipiente" id="figuras">
      <p class="vazio" data-t>Carregando os treinos...</p>
    </div>
  </main>
  <footer class="rodape"></footer>
  <script type="module" src="assets/js/prototipo-figuras.js"></script>
</body>
</html>
